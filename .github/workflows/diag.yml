name: Diag network
# Прогрів Smart Placement: серія запитів із США, щоб Cloudflare зрозумів, що сайт УЗ
# звідти недоступний, і переніс виконання воркера ближче до сайту (Європа).
on:
  workflow_dispatch:
    inputs:
      warmup:
        description: "Скільки запитів зробити для прогріву"
        default: "120"
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Warm up Smart Placement
        env:
          N: ${{ inputs.warmup }}
        run: |
          W="https://merefa-uz-gateway.stanislav-perec.workers.dev"
          ENC="https%3A%2F%2Fswrailway.gov.ua%2Ftimetable%2Feltrain%2F%3Fsid1%3D2528%26sid2%3D2538%26dateR%3D0"
          echo "runner: $(curl -s -m 10 https://api.ipify.org) ($(curl -s -m 10 https://ipinfo.io/country))"
          ok=0; colos=""
          for i in $(seq 1 "${N:-120}"); do
            code=$(curl -s -m 30 -o /tmp/b -D /tmp/h -w '%{http_code}' "$W/fetch?url=$ENC" || echo err)
            colo=$(grep -i '^cf-ray' /tmp/h | tr -d '\r' | awk -F- '{print $NF}')
            colos="$colos $colo"
            [ "$(grep -c ElTrain /tmp/b)" = "1" ] && ok=$((ok+1))
            if [ $((i % 20)) -eq 0 ]; then
              echo "  після $i запитів: успішних $ok, останній colo=$colo, HTTP $code"
            fi
            sleep 1
          done
          echo "--- підсумок ---"
          echo "успішних: $ok з ${N:-120}"
          echo "дата-центри:"; echo "$colos" | tr ' ' '\n' | grep -v '^$' | sort | uniq -c | sort -rn
