name: Diag network
# Ручна діагностика: у якому дата-центрі Cloudflare виконується воркер і чи бачить він сайт УЗ.
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Where does the Worker run
        run: |
          W="https://merefa-uz-gateway.stanislav-perec.workers.dev"
          ENC="https%3A%2F%2Fswrailway.gov.ua%2Ftimetable%2Feltrain%2F%3Fsid1%3D2528%26sid2%3D2538%26dateR%3D0"
          echo "runner ip: $(curl -s -m 10 https://api.ipify.org) ($(curl -s -m 10 https://ipinfo.io/country))"
          echo "--- дата-центр воркера (останні 3 літери cf-ray) ---"
          for i in 1 2 3; do
            curl -s -m 30 -D /tmp/h -o /dev/null "$W/"
            printf '  спроба %s: %s\n' "$i" "$(grep -i '^cf-ray' /tmp/h | tr -d '\r')"
            sleep 2
          done
          echo "--- запити до сайту УЗ через воркер ---"
          for i in 1 2 3 4 5; do
            code=$(curl -s -m 60 -o /tmp/b -D /tmp/h -w '%{http_code}' "$W/fetch?url=$ENC")
            printf '  %s: HTTP %-4s ElTrain=%s colo=%s\n' "$i" "$code" "$(grep -c ElTrain /tmp/b)" "$(grep -i '^cf-ray' /tmp/h | tr -d '\r' | awk -F- '{print $NF}')"
            sleep 5
          done
