name: Update schedule data

# Джерела даних:
#   * build_live.py : канал УЗ (затримки, скасування) щопівгодини, доступний звідусіль;
#   * розклад swrailway.gov.ua : тричі на добу, о 06:00, 10:00 і 13:00 за Києвом.
#
# Сайт УЗ відкидає з'єднання з великих хмар (Amazon, Microsoft, Google), тому ні раннер
# GitHub, ні Render до нього не дістають напряму. Запити йдуть через Cloudflare Worker
# (worker.js), який не заблокований.
#   * якщо заданий секрет GATEWAY_URL (адреса бота на Render), workflow просить бота
#     оновити розклад: той збирає через Worker і комітить schedule.json сам;
#   * якщо секрету немає, workflow збирає власними силами через шлюзи з секрету UZ_GATEWAYS.

on:
  schedule:
    - cron: "*/30 2-20 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Оновити розклад негайно, не чекаючи слоту 06:00/10:00/13:00"
        type: boolean
        default: false
      refresh_cache:
        description: "Перезавантажити сторінки всіх поїздів (trains_cache.json)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-schedule-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
      UZ_GATEWAYS: ${{ secrets.UZ_GATEWAYS }}
      SLOTS: "6,10,13"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests beautifulsoup4

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Timetable via collector service
        id: gateway
        if: env.GATEWAY_URL != ''
        continue-on-error: true
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" != "true" ] && ! python build_schedule.py --slots "$SLOTS" --check-only; then
            echo "Слот ще не настав, розклад не чіпаємо"
            exit 0
          fi
          echo "Буджу сервіс (безкоштовний Render засинає, холодний старт до хвилини)"
          curl -s -m 120 -o /dev/null "$GATEWAY_URL/" || true
          curl -s -m 120 -X POST "$GATEWAY_URL/refresh?force=1" | head -c 300; echo
          for i in $(seq 1 40); do
            sleep 10
            BODY=$(curl -s -m 30 "$GATEWAY_URL/status")
            echo "$BODY" | python -c "import sys,json; d=json.load(sys.stdin); print('running',d['running'],'| ok',d['ok'],'|',d['message'][:80])" || continue
            if echo "$BODY" | python -c "import sys,json; sys.exit(0 if not json.load(sys.stdin)['running'] else 1)"; then
              echo "$BODY" | python -c "import sys,json; sys.exit(0 if json.load(sys.stdin)['ok'] else 1)"
              exit $?
            fi
          done
          echo "Сервіс не відповів вчасно"; exit 1

      - name: Timetable fallback (direct build via gateways)
        if: env.GATEWAY_URL == ''
        continue-on-error: true
        env:
          FORCE: ${{ inputs.force }}
          REFRESH: ${{ inputs.refresh_cache }}
        run: |
          ARGS="--slots $SLOTS"
          [ "$FORCE" = "true" ] && ARGS="$ARGS --force"
          [ "$REFRESH" = "true" ] && ARGS="$ARGS --refresh-cache"
          python build_schedule.py $ARGS

      - name: Live channel messages (t.me/UZprymisky)
        run: python build_live.py

      - name: Report timetable failure
        if: steps.gateway.outcome == 'failure'
        run: echo "::warning::Розклад не оновлено (сервіс-збирач недоступний); live.json оновлено"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live.json schedule.json trains_cache.json
          if git diff --staged --quiet; then
            echo "Без змін"
            exit 0
          fi
          git commit -m "Auto-update $(TZ=Europe/Kyiv date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push
