name: Update schedule data

# Один workflow на обидва джерела:
#   * build_live.py     : канал УЗ (затримки, скасування) щопівгодини;
#   * build_schedule.py : офіційний розклад swrailway.gov.ua двічі на добу,
#                         о 06:00 і 12:00 за Києвом (скрипт сам вирішує за слотами,
#                         тому перехід на літній час і пропуски cron не шкодять).
#
# Сайт УЗ приймає з'єднання лише з європейських мереж, а раннер GitHub працює у США,
# тому запити йдуть через шлюз у Європі (перелік у uz.GATEWAYS). Власний шлюз
# (gateway.py на Render, регіон Frankfurt) задається секретом UZ_GATEWAYS і має пріоритет.

on:
  schedule:
    - cron: "*/30 2-20 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Оновити розклад негайно, не чекаючи слоту 06:00/12:00"
        type: boolean
        default: false
      refresh_cache:
        description: "Перезавантажити сторінки всіх поїздів (trains_cache.json)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-schedule-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UZ_GATEWAYS: ${{ secrets.UZ_GATEWAYS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests beautifulsoup4

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Official timetable (swrailway.gov.ua)
        id: timetable
        continue-on-error: true
        env:
          FORCE: ${{ inputs.force }}
          REFRESH: ${{ inputs.refresh_cache }}
        run: |
          ARGS="--slots 6,12"
          [ "$FORCE" = "true" ] && ARGS="$ARGS --force"
          [ "$REFRESH" = "true" ] && ARGS="$ARGS --refresh-cache"
          python build_schedule.py $ARGS

      - name: Live channel messages (t.me/UZprymisky)
        run: python build_live.py

      - name: Report timetable failure
        if: steps.timetable.outcome == 'failure'
        run: echo "::warning::Розклад УЗ не оновлено (сайт або шлюзи недоступні); live.json оновлено"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule.json live.json trains_cache.json
          if git diff --staged --quiet; then
            echo "Без змін"
            exit 0
          fi
          git commit -m "Auto-update $(TZ=Europe/Kyiv date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push
