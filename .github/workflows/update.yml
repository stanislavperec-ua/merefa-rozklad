name: Update schedule data

# Один workflow на обидва джерела, щоб не було гонок при push:
#   * build_live.py     : щопівгодини (канал УЗ: затримки, скасування);
#   * build_schedule.py : не частіше ніж раз на 4 години (офіційний розклад swrailway.gov.ua),
#                         або примусово через workflow_dispatch з force=true.
# Cron у UTC: 02:00-20:30 UTC = 05:00-23:30 Київ влітку, 04:00-22:30 взимку.

on:
  schedule:
    - cron: "*/30 2-20 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Примусово оновити розклад УЗ (ігнорувати вік schedule.json)"
        type: boolean
        default: false
      refresh_cache:
        description: "Перезавантажити сторінки всіх поїздів (trains_cache.json)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-schedule-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UZ_PROXY: ${{ secrets.UZ_PROXY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests beautifulsoup4

      - name: Unit tests
        run: python -m unittest discover -s tests

      # swrailway.gov.ua не відповідає з хмарних мереж (GitHub Actions, Render), тому цей крок
      # виконується лише якщо задано секрет UZ_PROXY (HTTPS-проксі з українським/незаблокованим IP,
      # наприклад Apify Proxy: http://groups-RESIDENTIAL,country-UA:<token>@proxy.apify.com:8000)
      # або при ручному запуску з force. Без проксі розклад оновлюється з ПК: update_schedule.cmd.
      - name: Official timetable (swrailway.gov.ua)
        id: timetable
        if: ${{ inputs.force || env.UZ_PROXY != '' }}
        continue-on-error: true
        env:
          FORCE: ${{ inputs.force }}
          REFRESH: ${{ inputs.refresh_cache }}
          HTTPS_PROXY: ${{ env.UZ_PROXY }}
        run: |
          ARGS="--max-age-hours 4"
          [ "$FORCE" = "true" ] && ARGS="$ARGS --force"
          [ "$REFRESH" = "true" ] && ARGS="$ARGS --refresh-cache"
          python build_schedule.py $ARGS

      - name: Live channel messages (t.me/UZprymisky)
        run: python build_live.py

      - name: Report timetable failure
        if: steps.timetable.outcome == 'failure'
        run: echo "::warning::Розклад УЗ не оновлено (сайт недоступний з раннера), live.json оновлено"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule.json live.json trains_cache.json
          if git diff --staged --quiet; then
            echo "Без змін"
            exit 0
          fi
          git commit -m "Auto-update $(TZ=Europe/Kyiv date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push
