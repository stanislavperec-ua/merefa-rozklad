name: Update schedule data

# Джерела даних:
#   * build_live.py : канал УЗ (затримки, скасування) щопівгодини, доступний звідусіль;
#   * розклад swrailway.gov.ua : тричі на добу, о 06:00, 10:00 і 13:00 за Києвом.
#
# Сайт УЗ відкидає з'єднання з великих хмар (Amazon, Microsoft, Google), тому раннер GitHub
# не дістає його напряму. Запити йдуть через Cloudflare Worker (worker.js), адреса якого
# зашита в uz.GATEWAYS. Збірка виконується тут, а не на Render: безкоштовний Render має
# 0.1 CPU і розбирає 60 сторінок понад 20 хвилин, тоді як раннер укладається в хвилину.

on:
  schedule:
    - cron: "*/30 2-20 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Оновити розклад негайно, не чекаючи слоту 06:00/10:00/13:00"
        type: boolean
        default: false
      refresh_cache:
        description: "Перезавантажити сторінки всіх поїздів (trains_cache.json)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-schedule-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UZ_GATEWAYS: ${{ secrets.UZ_GATEWAYS }}
      SLOTS: "6,10,13"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests beautifulsoup4

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Official timetable (via Cloudflare Worker)
        id: timetable
        continue-on-error: true
        env:
          FORCE: ${{ inputs.force }}
          REFRESH: ${{ inputs.refresh_cache }}
          UZ_DIRECT: "0"
        run: |
          ARGS="--slots $SLOTS"
          [ "$FORCE" = "true" ] && ARGS="$ARGS --force"
          [ "$REFRESH" = "true" ] && ARGS="$ARGS --refresh-cache"
          python build_schedule.py $ARGS

      - name: Live channel messages (t.me/UZprymisky)
        run: python build_live.py

      - name: Report timetable failure
        if: steps.timetable.outcome == 'failure'
        run: echo "::warning::Розклад не оновлено (сервіс-збирач недоступний); live.json оновлено"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live.json schedule.json trains_cache.json
          if git diff --staged --quiet; then
            echo "Без змін"
            exit 0
          fi
          git commit -m "Auto-update $(TZ=Europe/Kyiv date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push
