name: Update schedule data

# Джерела даних:
#   * build_live.py : канал УЗ (затримки, скасування) щопівгодини, доступний звідусіль;
#   * розклад swrailway.gov.ua : двічі на добу, о 06:00 і 13:00 за Києвом.
#
# Сайт УЗ відкидає з'єднання з великих хмар. Єдиний шлях до нього це Cloudflare Worker
# (worker.js), але воркер виконується поруч із тим, хто його викликав: із раннера GitHub
# він потрапляє в Лос-Анджелес чи Вашингтон і отримує 522, а з бота на Render потрапляє
# в дата-центр, який сайт пускає. Тому збірку робить бот, а цей workflow його будить.

on:
  schedule:
    # Розклад у слоти 06:00 і 13:00 за Києвом збирає Cloudflare Worker за своїм Cron Trigger.
    # Цей workflow оновлює live.json і лишається запасним шляхом для розкладу, тому ходить
    # на чверть години пізніше: якщо воркер уже впорався, крок розкладу просто пропускається.
    - cron: "15,45 2-20 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Оновити розклад негайно, не чекаючи слоту 06:00/13:00"
        type: boolean
        default: false
      refresh_cache:
        description: "Перезавантажити сторінки всіх поїздів (trains_cache.json)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-schedule-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UZ_GATEWAYS: ${{ secrets.UZ_GATEWAYS }}
      SLOTS: "6,13"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests beautifulsoup4

      - name: Unit tests
        run: python -m unittest discover -s tests

      # Розклад у слоти збирає Cloudflare Worker за своїм Cron Trigger. Цей крок лише
      # підстраховує: якщо слот відпрацьовано, він пропускається, а якщо ні, будить бота,
      # і той обходить сайт сам. Повільно (до десяти хвилин), зате не залежить від воркера.
      #
      # Кликати воркер звідси марно: Cloudflare виконує його поруч із тим, хто покликав,
      # тож із раннера GitHub (США) воркер потрапляє в дата-центр, який сайт УЗ відкидає.
      # Перевірено 15.09.2026: із 30 сторінок завантажились 11.
      - name: Official timetable (fallback via bot on Render)
        id: timetable
        continue-on-error: true
        env:
          FORCE: ${{ inputs.force }}
          BOT: https://merefa-rozklad.onrender.com
        run: |
          if [ "$FORCE" != "true" ] && ! python build_schedule.py --slots "$SLOTS" --check-only; then
            echo "Слот ще не настав, розклад не чіпаємо"
            exit 0
          fi
          echo "Буджу бота"
          curl -s -m 120 -o /dev/null "$BOT/" || true
          curl -s -m 120 -X POST "$BOT/refresh?force=1&days=14" | head -c 200; echo
          for i in $(seq 1 50); do
            sleep 30
            BODY=$(curl -s -m 30 "$BOT/status")
            echo "$BODY" | python -c "import sys,json; d=json.load(sys.stdin); print('  running',d['running'],'| ok',d['ok'],'|',(d['message'] or '')[:70])" || continue
            if echo "$BODY" | python -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if (not d['running'] and d['ok'] is not None) else 1)"; then
              echo "$BODY" | python -c "import sys,json; sys.exit(0 if json.load(sys.stdin)['ok'] else 1)"
              exit $?
            fi
          done
          echo "Бот не впорався за 25 хвилин"; exit 1

      - name: Live channel messages (t.me/UZprymisky)
        run: python build_live.py

      - name: Report timetable failure
        if: steps.timetable.outcome == 'failure'
        run: echo "::warning::Розклад не оновлено (сервіс-збирач недоступний); live.json оновлено"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live.json schedule.json trains_cache.json
          if git diff --staged --quiet; then
            echo "Без змін"
            exit 0
          fi
          git commit -m "Auto-update $(TZ=Europe/Kyiv date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push
